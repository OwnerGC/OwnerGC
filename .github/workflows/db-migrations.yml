# Applies new database changes (supabase/migrations/) to the real Supabase
# project whenever they land on main, so nobody has to paste SQL by hand.
#
# Needs two GitHub repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password for the project
# Free: runs on GitHub's free CI minutes.
name: Apply database migrations

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch: # also lets you run it by hand from the Actions tab

# Never run two at once against the same database.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: tshqvejbbvjrrxwaxszc
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The supabase CLI targets a local database unless a command gets --remote.
      - name: Connect to the Supabase project
        run: npx supabase link --project-ref "$PROJECT_REF"
      # Phase 1 was applied by hand in the SQL Editor on 2026-11-20, so the
      # project's migration history doesn't know about it yet. Record it as
      # applied so it isn't run a second time. (Harmless once it's recorded.)
      - name: Record migrations that were applied by hand
        run: npx supabase migration repair --remote --status applied 20261120000000
      - name: Show what will run
        run: npx supabase migration list --remote
      - name: Apply new migrations
        run: npx supabase db push --remote
